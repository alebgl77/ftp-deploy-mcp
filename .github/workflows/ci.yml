name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review introduced dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --ignore-scripts

      - name: Validate bilingual documentation
        run: node scripts/check-docs.mjs

      - name: Check generated bilingual guide
        run: node scripts/build-guide.mjs --check

      - name: Test documentation and guide checks
        run: node --test test/build-guide.mjs

      - run: npm test

      - name: Test scripted evaluation runner
        run: npm run test:eval-runner

      - name: Run bilingual scripted MCP evaluations
        run: npm run eval:scripted

      - name: Validate scripted evaluation evidence
        run: node scripts/evaluation/validate-report.mjs .tmp/evaluations/reports/latest.json --ci true --locale both

  release:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record qualified release toolchain versions
        shell: bash
        run: node scripts/release-toolchain.mjs | tee "$RUNNER_TEMP/release-toolchain.json"

      - run: npm ci --ignore-scripts

      - name: Complete release qualification (pass 1)
        shell: bash
        run: npm run test:release | tee "$RUNNER_TEMP/release-tests-1.tap"

      - name: Complete macOS release qualification (pass 2 of 3)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        run: npm run test:release | tee "$RUNNER_TEMP/release-tests-2.tap"

      - name: Complete macOS release qualification (pass 3 of 3)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        run: npm run test:release | tee "$RUNNER_TEMP/release-tests-3.tap"

      - name: Preserve toolchain versions and every completed release pass
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-qualification-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/release-toolchain.json
            ${{ runner.temp }}/release-tests-*.tap

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --ignore-scripts

      - name: Record qualified release toolchain versions
        run: node scripts/release-toolchain.mjs

      - name: Validate MCP manifest
        run: node scripts/release-gate.mjs --source-only --runtime

      - run: npm audit --omit=dev --audit-level=moderate

      - name: Generate production CycloneDX SBOM
        shell: bash
        run: |
          node node_modules/@cyclonedx/cyclonedx-npm/bin/cyclonedx-npm-cli.js \
            --omit dev \
            --spec-version 1.5 \
            --output-reproducible \
            --output-format JSON \
            --output-file "$RUNNER_TEMP/ftp-deploy-mcp.cdx.json" \
            --validate
          npm ls --omit=dev --all --json > "$RUNNER_TEMP/npm-production-tree.json"

      - name: Validate production CycloneDX SBOM
        env:
          SBOM_PATH: ${{ runner.temp }}/ftp-deploy-mcp.cdx.json
          NPM_TREE_PATH: ${{ runner.temp }}/npm-production-tree.json
        run: node test/sbom-contract.mjs "$SBOM_PATH" "$NPM_TREE_PATH"

      - name: Upload production SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-sbom
          path: ${{ runner.temp }}/ftp-deploy-mcp.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Validate package contents
        run: |
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module -e "import{readFileSync}from'node:fs';import{validatePack}from'./scripts/release-artifact.mjs';import{readRelease}from'./scripts/release-gate.mjs';validatePack(JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/npm-pack.json','utf8')),readRelease(process.cwd(),undefined,{sourceOnly:true}).release)"
