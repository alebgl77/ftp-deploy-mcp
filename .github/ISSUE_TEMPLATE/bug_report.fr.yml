name: Signaler un bogue (français)
description: Signaler un problème avec ftp-deploy-mcp
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Que s'est-il passé ?
      description: Une description claire du problème.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Quel comportement attendiez-vous ?
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: Client MCP
      options:
        - Claude Code
        - Claude Desktop
        - Cursor
        - Windsurf
        - Trae
        - Antigravity
        - Autre
    validations:
      required: true

  - type: dropdown
    id: protocol
    attributes:
      label: Protocole
      options:
        - ftp
        - ftps
        - sftp
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Système d'exploitation
      placeholder: Par exemple Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Version de Node
      placeholder: Par exemple v22.23.1 (exécutez `node -v`)
    validations:
      required: true

  - type: textarea
    id: doctor-output
    attributes:
      label: "Sortie de `doctor` (informations sensibles masquées)"
      description: >
        Exécutez `npm run doctor` et collez la sortie ci-dessous. **Supprimez les
        noms d'hôtes, les noms d'utilisateurs et toute autre information
        permettant de vous identifier avant de coller** : ce suivi est public.
      render: text
    validations:
      required: true
