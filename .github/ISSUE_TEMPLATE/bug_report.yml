name: Bug report
description: Report a problem with ftp-deploy-mcp
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Code
        - Claude Desktop
        - Cursor
        - Windsurf
        - Trae
        - Antigravity
        - Other
    validations:
      required: true

  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options:
        - ftp
        - ftps
        - sftp
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: e.g. v22.23.1 (run `node -v`)
    validations:
      required: true

  - type: textarea
    id: doctor-output
    attributes:
      label: "`doctor` output (redacted)"
      description: >
        Run `npm run doctor` and paste the output below. **Remove hostnames,
        usernames, and any other identifying information before pasting** —
        this is a public issue tracker.
      render: text
    validations:
      required: true
