<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="ftp-deploy-mcp architecture: AI clients connect over MCP stdio to ftp-deploy-mcp, which reaches FTP, FTPS or SFTP servers">
  <title>ftp-deploy-mcp architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- ===== left: 6 client chips ===== -->
    <g fill="#111A2E" stroke="#64748B" stroke-width="1">
      <rect x="40" y="111" width="150" height="38" rx="10"/>
      <rect x="40" y="163" width="150" height="38" rx="10"/>
      <rect x="40" y="215" width="150" height="38" rx="10"/>
      <rect x="40" y="267" width="150" height="38" rx="10"/>
      <rect x="40" y="319" width="150" height="38" rx="10"/>
      <rect x="40" y="371" width="150" height="38" rx="10"/>
    </g>
    <g fill="#E2E8F0" font-weight="600" font-size="15" text-anchor="middle">
      <text x="115" y="135">Claude Code</text>
      <text x="115" y="187">Claude Desktop</text>
      <text x="115" y="239">Cursor</text>
      <text x="115" y="291">Windsurf</text>
      <text x="115" y="343">Trae</text>
      <text x="115" y="395">Antigravity</text>
    </g>

    <!-- merge bracket: 6 stubs -> vertical spine -> single arrow -->
    <g stroke="#64748B" stroke-width="1.5" fill="none">
      <line x1="190" y1="130" x2="210" y2="130"/>
      <line x1="190" y1="182" x2="210" y2="182"/>
      <line x1="190" y1="234" x2="210" y2="234"/>
      <line x1="190" y1="286" x2="210" y2="286"/>
      <line x1="190" y1="338" x2="210" y2="338"/>
      <line x1="190" y1="390" x2="210" y2="390"/>
      <line x1="210" y1="130" x2="210" y2="390"/>
      <line x1="210" y1="260" x2="452" y2="260" marker-end="url(#arrow)"/>
    </g>
    <rect x="287" y="247" width="96" height="26" rx="13" fill="#111A2E" stroke="#64748B" stroke-width="1"/>
    <text x="335" y="265" text-anchor="middle" fill="#E2E8F0" font-weight="600" font-size="13">MCP (stdio)</text>

    <!-- ===== center: ftp-deploy-mcp card ===== -->
    <rect x="460" y="150" width="280" height="210" rx="20" fill="#111A2E" stroke="#64748B" stroke-width="1.5"/>
    <text x="600" y="184" text-anchor="middle" fill="#E2E8F0" font-weight="700" font-size="21">ftp-deploy-mcp</text>
    <text x="600" y="216" text-anchor="middle" fill="#94A3B8" font-weight="400" font-size="14">10 tools &#183; path jail</text>
    <text x="600" y="238" text-anchor="middle" fill="#94A3B8" font-weight="400" font-size="14">read-only &#183; dry-run</text>

    <!-- key icon -->
    <g transform="translate(589,259)" fill="none" stroke="#22D3EE" stroke-width="2.6" stroke-linecap="round">
      <circle cx="7" cy="11" r="4.2"/>
      <line x1="11" y1="11" x2="20" y2="11"/>
      <line x1="17" y1="11" x2="17" y2="15"/>
      <line x1="20" y1="11" x2="20" y2="14.5"/>
    </g>

    <text x="600" y="300" text-anchor="middle" fill="#94A3B8" font-weight="400" font-size="12">credentials stay in</text>
    <text x="600" y="316" text-anchor="middle" fill="#94A3B8" font-weight="400" font-size="12">ftp-servers.json (local)</text>

    <!-- ===== right: fan-out to two protocols/servers ===== -->
    <g stroke="#64748B" stroke-width="1.5" fill="none">
      <line x1="740" y1="255" x2="962" y2="182" marker-end="url(#arrow)"/>
      <line x1="740" y1="255" x2="962" y2="338" marker-end="url(#arrow)"/>
    </g>

    <rect x="809" y="204" width="92" height="26" rx="13" fill="#111A2E" stroke="#64748B" stroke-width="1"/>
    <text x="855" y="222" text-anchor="middle" fill="#E2E8F0" font-weight="600" font-size="13">FTP / FTPS</text>

    <rect x="808" y="284" width="94" height="26" rx="13" fill="#111A2E" stroke="#64748B" stroke-width="1"/>
    <text x="855" y="302" text-anchor="middle" fill="#E2E8F0" font-weight="600" font-size="13">SFTP (SSH)</text>

    <rect x="970" y="130" width="190" height="100" rx="16" fill="#111A2E" stroke="#64748B" stroke-width="1.5"/>
    <text x="1065" y="186" text-anchor="middle" fill="#E2E8F0" font-weight="700" font-size="16">shared hosting</text>

    <rect x="970" y="290" width="190" height="100" rx="16" fill="#111A2E" stroke="#64748B" stroke-width="1.5"/>
    <text x="1065" y="346" text-anchor="middle" fill="#E2E8F0" font-weight="700" font-size="16">your servers</text>
  </g>
</svg>
