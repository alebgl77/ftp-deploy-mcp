<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="ftp-deploy-mcp — deploy from your AI agent to any FTP, FTPS or SFTP server">
  <title>ftp-deploy-mcp</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="hiGrad" x1="0" y1="0" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="256" height="256" rx="56" ry="56"/>
    </clipPath>

    <radialGradient id="glow" cx="150" cy="120" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#94A3B8"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="640" fill="#0B1120"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#grid)" opacity="0.06"/>

  <!-- ============ LEFT COLUMN ============ -->
  <g transform="translate(90,135) scale(0.28125)">
    <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bgGrad)"/>
    <g clip-path="url(#roundedClip)">
      <rect x="0" y="0" width="256" height="150" fill="url(#hiGrad)"/>
    </g>
    <path d="M128 65 L160 101 L142 101 L142 141 L114 141 L114 101 L96 101 Z" fill="#FFFFFF"/>
    <rect x="76" y="155" width="104" height="14" rx="7" fill="#FFFFFF"/>
    <circle cx="168" cy="162" r="4" fill="url(#bgGrad)"/>
    <rect x="76" y="177" width="104" height="14" rx="7" fill="#FFFFFF"/>
    <circle cx="168" cy="184" r="4" fill="url(#bgGrad)"/>
  </g>

  <text x="180" y="184" font-family="ui-sans-serif, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="36" letter-spacing="-0.3"><tspan fill="#E2E8F0">ftp-deploy</tspan><tspan fill="#94A3B8">-mcp</tspan></text>

  <text font-family="ui-sans-serif, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="40" fill="#FFFFFF">
    <tspan x="90" y="289">Deploy from your AI agent.</tspan>
    <tspan x="90" y="340">To any FTP &#183; FTPS &#183; SFTP server.</tspan>
  </text>

  <!-- feature chips -->
  <g font-family="ui-sans-serif, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="16" fill="#E2E8F0" text-anchor="middle">
    <rect x="90" y="415" width="112" height="40" rx="20" fill="#111A2E" stroke="#6366F1" stroke-width="1"/>
    <text x="146" y="440">path jail</text>

    <rect x="218" y="415" width="110" height="40" rx="20" fill="#111A2E" stroke="#6366F1" stroke-width="1"/>
    <text x="273" y="440">dry-run</text>

    <rect x="344" y="415" width="164" height="40" rx="20" fill="#111A2E" stroke="#6366F1" stroke-width="1"/>
    <text x="426" y="440">FileZilla import</text>
  </g>

  <text x="90" y="495" font-family="ui-sans-serif, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#94A3B8">Claude Code &#183; Claude Desktop &#183; Cursor &#183; Windsurf &#183; Trae &#183; Antigravity</text>

  <!-- ============ RIGHT COLUMN: terminal mock ============ -->
  <rect x="700" y="185" width="490" height="270" rx="16" fill="#111A2E" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="700" y1="225" x2="1190" y2="225" stroke="#1E293B" stroke-width="1"/>
  <circle cx="724" cy="205" r="6" fill="#94A3B8" opacity="0.45"/>
  <circle cx="748" cy="205" r="6" fill="#94A3B8" opacity="0.65"/>
  <circle cx="772" cy="205" r="6" fill="#94A3B8" opacity="0.85"/>

  <g font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14">
    <text x="724" y="265" fill="#E2E8F0">you  &#8250; Deploy ./dist to prod</text>
    <text x="724" y="297" fill="#22D3EE">agent&#8250; ftp_deploy(server:"prod", dir:"./dist")</text>
    <text x="724" y="329" fill="#94A3B8">      dry-run: 42 files, 1.3 MB</text>
    <text x="724" y="361" fill="#34D399">      &#10003; uploaded 42 files in 8.2s</text>
    <text x="724" y="393" fill="#FBBF24">      &#8211; .env, node_modules excluded (jail: /www)</text>
  </g>

  <text x="1190" y="600" text-anchor="end" font-family="ui-sans-serif, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#94A3B8">MIT &#183; 189 e2e tests &#183; no telemetry</text>
</svg>
